# Inclusion and labeling rules for AI-for-science and computational biology faculty jobs.
# A posting qualifies with a strong intersection term, or with both an AI term
# and a life-science term. Regular expressions are case-insensitive.

strong_fit_terms:
  - '\bcomputational biolog\w*'
  - '\bcomputational genom\w*'
  - '\bbioinformatic\w*'
  - '\bbiomedical informatic\w*'
  - '\bhealth informatic\w*'
  - '\bcheminformatic\w*'
  - '\bscientific machine learning\b'
  - '\bmachine learning for (?:science|biology|medicine|health|chemistry|drug discovery)\b'
  - '\bAI for (?:science|biology|medicine|health|chemistry|drug discovery)\b'
  - '\bartificial intelligence for (?:science|biology|medicine|health|chemistry|drug discovery)\b'
  - '\b(?:AI|ML)[\s\-](?:enabled|driven|guided) (?:biology|medicine|science|discovery|health)\b'
  - '\bprotein (?:design|language model\w*)\b'
  - '\bcomputational (?:drug discovery|medicine|pathology|neuroscience)\b'
  - '\bdigital (?:biology|health|medicine)\b'
  - '\bsystems biology\b'
  - '\bquantitative biology\b'
  - '\bbiological data science\b'

ai_terms:
  - '\bartificial intelligence\b'
  - '\bmachine learning\b'
  - '\bdeep learning\b'
  - '\bgenerative AI\b'
  - '\bfoundation model\w*\b'
  - '\blarge language model\w*\b'
  - '\bneural network\w*\b'
  - '\breinforcement learning\b'
  - '\bcomputer vision\b'
  - '\bdata science\b'
  - '\bdata[\s\-]driven\b'
  - '\bpredictive model\w*\b'
  - '\bstatistical learning\b'
  - '\b(?:AI|ML)\b'

biology_terms:
  - '\bbiolog\w*'
  - '\bbiomedical\b'
  - '\bmedicine\b'
  - '\bmedical\b'
  - '\bhealth\b'
  - '\bclinical\b'
  - '\bgenom\w*'
  - '\btranscriptom\w*'
  - '\bproteom\w*'
  - '\bmulti[\s\-]?omics?\b'
  - '\bprotein\w*'
  - '\bcell\w*'
  - '\bmolecul\w*'
  - '\bneuro\w*'
  - '\bdrug\w*'
  - '\btherapeut\w*'
  - '\bpharmac\w*'
  - '\bchem\w*'
  - '\becolog\w*'
  - '\benvironment\w*'
  - '\bclimate\b'
  - '\bagricultur\w*'
  - '\bplant\w*'
  - '\banimal\w*'
  - '\bmicrobi\w*'
  - '\bscientific discovery\b'

faculty_title_patterns:
  - '\bprofessor\w*'
  - '\bprof\.'
  - '\bfaculty\b'
  - '\bopen[\s\-]rank\b'
  - '\btenure'
  - '\blecturer\b'
  - '\breader\b'
  - '\bprincipal investigator\b'
  - '\bgroup leader\b'
  - '\bjunior research group\b'
  - '\b(?:assistant|associate|full) member\b'
  - '\bchair\b'
  - '\binvestigator\b'
  - '\bclinician[\s\-]scientist\b'
  - '\bphysician[\s\-]scientist\b'

exclude_title_patterns:
  - '\bpost[\s\-]?doc\w*'
  - '\bpostdoctoral\b'
  - '\bgraduate (?:student|assistant)\b'
  - '\bph\.?d\.?\s+(?:student|candidate|position|studentship)'
  - '\bdoctoral (?:student|candidate|researcher)\b'
  - '\bstudentship\b'
  - '\btechnician\b'
  - '\bresearch (?:assistant|associate|scientist|technologist|specialist|coordinator)\b(?!\s+professor)'
  - '\bstaff scientist\b'
  - '\blab(?:oratory)? manager\b'
  - '\badjunct\b'
  - '\bpart[\s\-]time\b'
  - '\bintern(?:ship)?\b'
  - '\bfellow(?:ship)?\b(?!.*professor)'
  - '\bvisiting\b'
  - '\bemeritus\b'

domains:
  foundations:
    label: AI methods & foundations
    color: '#7c3aed'
    patterns:
      - '\bfoundation model\w*'
      - '\bgenerative AI\b'
      - '\blarge language model\w*'
      - '\bdeep learning\b'
      - '\breinforcement learning\b'
      - '\bscientific machine learning\b'
      - '\bcausal (?:inference|learning)\b'
  genomics:
    label: Genomics & multi-omics
    color: '#2563eb'
    patterns:
      - '\bgenom\w*'
      - '\btranscriptom\w*'
      - '\bepigenom\w*'
      - '\bproteom\w*'
      - '\bmulti[\s\-]?omics?\b'
      - '\bsingle[\s\-]cell\b'
      - '\bspatial (?:biology|omics|transcriptom\w*)\b'
  proteins:
    label: Proteins & molecular design
    color: '#0891b2'
    patterns:
      - '\bprotein\w*'
      - '\bstructural biolog\w*'
      - '\bmolecular design\b'
      - '\bmolecular dynamic\w*'
      - '\bbiomolecul\w*'
  drug_discovery:
    label: Drug discovery
    color: '#db2777'
    patterns:
      - '\bdrug (?:discovery|design|development|screening)\b'
      - '\btherapeut\w*'
      - '\bpharmac\w*'
      - '\bcheminformatic\w*'
      - '\bmedicinal chemistry\b'
  health:
    label: Health & medicine
    color: '#dc2626'
    patterns:
      - '\bhealth\b'
      - '\bmedicine\b'
      - '\bmedical\b'
      - '\bclinical\b'
      - '\bbiomedical\b'
      - '\bpatient\w*'
      - '\bdisease\w*'
  imaging:
    label: Imaging & computer vision
    color: '#ea580c'
    patterns:
      - '\bimag\w*'
      - '\bcomputer vision\b'
      - '\bpathology\b'
      - '\bradiolog\w*'
      - '\bmicroscop\w*'
  neuroscience:
    label: Neuroscience
    color: '#9333ea'
    patterns:
      - '\bneuro\w*'
      - '\bbrain\b'
      - '\bcognitive\b'
  cells_systems:
    label: Cells & systems biology
    color: '#0d9488'
    patterns:
      - '\bcell\w*'
      - '\bsystems biology\b'
      - '\bquantitative biology\b'
      - '\bdevelopmental biolog\w*'
      - '\bsynthetic biolog\w*'
  ecology:
    label: Ecology & climate
    color: '#15803d'
    patterns:
      - '\becolog\w*'
      - '\benvironment\w*'
      - '\bclimate\b'
      - '\bconservation\b'
      - '\bbiodiversity\b'
      - '\bearth system\w*'
  agriculture:
    label: Agriculture & plant science
    color: '#65a30d'
    patterns:
      - '\bagricultur\w*'
      - '\bplant\w*'
      - '\bcrop\w*'
      - '\bfood\b'
      - '\banimal science\b'
  bioinformatics:
    label: Bioinformatics & data science
    color: '#475569'
    patterns:
      - '\bbioinformatic\w*'
      - '\bcomputational biolog\w*'
      - '\bbiological data science\b'
      - '\bbiomedical informatic\w*'
      - '\bhealth informatic\w*'

min_hits:
  default: 1
